[package]
name = "secchat_mls_bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
openmls = { version = "0.8.1", features = ["test-utils", "libcrux-provider"] }
openmls_basic_credential = { version = "0.5", features = ["clonable"] }
openmls_libcrux_crypto = "0.3.1"
openmls_memory_storage = { version = "0.5", features = ["test-utils"] }
openmls_traits = "0.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
